<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzón CUC Escucha</title>

    <link rel="stylesheet" href="css/buzon_cuc_escucha_style.css">
<script type="text/javascript" src="https://gc.kis.v2.scr.kaspersky-labs.com/FD126C42-EBFA-4E12-B309-BB3FDD723AC1/main.js?attr=GQXLKzpwzJqgLXBmOgpvtUt4i86L5v2CR7EgFTozTgOm7M0eG86ABv9iupfEFg0jPkJ7nobtLn2ez5XaQRx6laVikIEoe8JJ5UpUM4etsA1ykYvJ48Ww2Kx9cBeCgDJUPa_AsYqurGCBwpUZwD-lfaFkAXMZAVU5kzRqSvC2MH4" charset="UTF-8"></script></head>

<body>

    <header>
        <h1>Buzón CUC Escucha</h1>
        <p>Tu opinión ayuda a mejorar nuestra universidad</p>
    </header>

    <main>

        <section class="contenedor">

            <h2>Comparte tu sugerencia</h2>

            <form id="formulario-sugerencia">

                <div class="grupo">
                    <label for="nombre">Nombre completo</label>
                    <input 
                        type="text" 
                        id="nombre" 
                        name="nombre"
                        placeholder="Ej. Laura Gómez"
                        required>
                </div>

                <div class="grupo">
                    <label for="correo">Correo institucional</label>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="estudiante@cuc.edu.co"
                        required>
                </div>

                <div class="grupo">
                    <label for="edad">Edad</label>
                    <input
                        type="number"
                        id="edad"
                        name="edad"
                        placeholder="18"
                        required>
                </div>

                <div class="grupo">
                    <label for="categoria">Categoría de la sugerencia</label>

                    <select id="categoria" name="categoria" required>
                        <option value="">Seleccione una opción</option>
                        <option value="bienestar">Bienestar estudiantil</option>
                        <option value="servicios">Servicios</option>
                        <option value="clases">Clases y docentes</option>
                        <option value="inclusion">Inclusión</option>
                        <option value="espacios">Espacios físicos</option>
                        <option value="procesos">Procesos académicos</option>
                    </select>
                </div>

                <div class="fila">

                    <div class="grupo">
                        <label for="prioridad">Prioridad</label>
                        <input 
                            type="text" 
                            id="prioridad" 
                            name="prioridad" placeholder="Baja, media o alta"
                            required>
                    </div>

                    <div class="grupo">
                        <label for="anonimo">¿Deseas enviar la sugerencia de forma anónima?</label>
                        <input 
                            type="checkbox" 
                            id="anonimo" 
                            name="anonimo" value="si"
                            required>
                    </div>

                </div>

                <div class="grupo">
                    <label for="mensaje">Observaciones</label>

                    <textarea 
                        id="mensaje" 
                        name="mensaje"
                        rows="4"
                        placeholder="Describe tu idea, situación o propuesta de mejora...">
                    </textarea>
                </div>

                <button type="submit">Enviar sugerencia</button>

            </form>

        </section>

    </main>

    <footer>
        <p>Universidad de la Costa | Buzón CUC Escucha</p>
    </footer>

</body>

</html>
